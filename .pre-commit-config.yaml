default_stages: [pre-commit, pre-push, manual]

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: trailing-whitespace
        # Preserve the pinned upstream source bytes and their recorded hashes.
        exclude: ^tokenspeed-kernel/python/tokenspeed_kernel/thirdparty/(?:flashmla_public_sm90/csrc/(?:flashmla|cutlass)/|cuda/csrc/marlin_mxfp8_dense/(?:dequant\.h|kernel\.h|marlin\.cuh|marlin_dtypes\.cuh|marlin_mma\.h|marlin_template\.h)$)
      - id: end-of-file-fixer
        exclude: ^tokenspeed-kernel/python/tokenspeed_kernel/thirdparty/(?:flashmla_public_sm90/csrc/(?:flashmla|cutlass)/|cuda/csrc/marlin_mxfp8_dense/(?:dequant\.h|kernel\.h|marlin\.cuh|marlin_dtypes\.cuh|marlin_mma\.h|marlin_template\.h)$)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
        exclude: ^tokenspeed-kernel/python/tokenspeed_kernel/thirdparty/flashmla_public_sm90/csrc/(?:flashmla|cutlass)/
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
  - repo: https://github.com/pre-commit/mirrors-clang-format
    # Pin to the major version the CI lint job installs (ubuntu-latest
    # clang-format 18); other majors format differently and ping-pong.
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: ^tokenspeed-scheduler/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black-jupyter
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          - '--keep-output'
          - '--extra-keys=metadata.kernelspec metadata.language_info.version'
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: AMD ops README line length
        files: ^tokenspeed-kernel-amd/python/tokenspeed_kernel_amd/ops/README\.md$
        args:
          - --config
          - tokenspeed-kernel-amd/python/tokenspeed_kernel_amd/ops/.markdownlint.yaml
